<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST FRONTIER | LOBBY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700;800&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

body{
    width:100vw;height:100vh;overflow:hidden;
    background:#090c12;color:white;
    font-family:'Rajdhani',sans-serif;
}

.background{
    position:fixed;inset:0;z-index:-2;
    background:
    linear-gradient(90deg,#080b11 0%,#080b11dd 32%,#080b1155 100%),
    radial-gradient(ellipse at 75% 45%,#75402255,transparent 55%),
    linear-gradient(140deg,#222a35,#080b11 70%);
}

.background:after{
    content:"";position:absolute;inset:0;
    background-image:
    linear-gradient(#ffffff08 1px,transparent 1px),
    linear-gradient(90deg,#ffffff08 1px,transparent 1px);
    background-size:55px 55px;
    mask-image:linear-gradient(90deg,transparent,black);
}

.topbar{
    position:absolute;top:0;left:0;right:0;height:78px;
    display:flex;align-items:center;padding:0 45px;
    background:linear-gradient(90deg,#090c12f5,#090c12aa);
    border-bottom:1px solid #ffffff16;z-index:5;
}

.brand{font-size:29px;font-weight:800;letter-spacing:3px;white-space:nowrap}
.brand span{color:#ff702b}

.nav{
    display:flex;height:100%;align-items:center;
    gap:38px;margin-left:75px;
}

.nav-item{
    height:100%;display:flex;align-items:center;
    color:#8e98a7;font-size:19px;font-weight:700;
    letter-spacing:1px;cursor:pointer;position:relative;
    transition:.2s;background:none;border:none;font-family:inherit;
}

.nav-item:hover,.nav-item.active{color:white}

.nav-item.active:after{
    content:"";position:absolute;bottom:0;left:0;right:0;
    height:3px;background:#ff702b;box-shadow:0 0 15px #ff702b;
}

.profile{
    margin-left:auto;display:flex;align-items:center;gap:12px;
}

.avatar{
    width:42px;height:42px;flex-shrink:0;
    border:2px solid #ff702b;
    background:linear-gradient(135deg,#333d4c,#141922);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;font-weight:800;line-height:1;padding:0;
    clip-path:polygon(20% 0,100% 0,100% 80%,80% 100%,0 100%,0 20%);
}

.player-name{font-size:18px;font-weight:700;white-space:nowrap}

.left-panel{
    position:absolute;left:6%;top:24%;width:410px;
}

.eyebrow{
    color:#ff792f;font-size:17px;font-weight:800;
    letter-spacing:5px;margin-bottom:12px;
}

.title{
    font-size:clamp(45px,5vw,76px);
    font-weight:800;line-height:.92;letter-spacing:1px;
}

.title span{color:#ff702b}

.description{
    margin-top:23px;color:#9da7b5;
    font-size:19px;line-height:1.4;max-width:340px;
}

.section-line{margin-top:34px;width:75px;height:3px;background:#ff702b}

.mode-title{
    margin-top:30px;color:#778493;font-size:15px;
    font-weight:800;letter-spacing:3px;
}

.mode{
    margin-top:12px;width:100%;height:75px;
    border:1px solid #ff702b;
    background:linear-gradient(90deg,#ff702b22,#ffffff08);
    display:flex;align-items:center;padding:0 19px;gap:15px;
}

.mode-icon{font-size:28px}
.mode-name{font-size:22px;font-weight:800;letter-spacing:1px}

.play-button{
    margin-top:30px;width:100%;height:72px;border:none;
    background:linear-gradient(100deg,#ff4b16,#ff862f);
    color:white;font-family:inherit;font-size:25px;
    font-weight:800;letter-spacing:4px;cursor:pointer;
    clip-path:polygon(0 0,96% 0,100% 20%,100% 100%,4% 100%,0 80%);
    box-shadow:0 0 35px #ff702b44;transition:.2s;
}

.play-button:hover{background:white;color:#ff5a1b;transform:translateY(-2px)}
.play-button:active{transform:scale(.98)}

.right-decoration{
    position:absolute;right:8%;top:19%;width:40%;height:65%;
    display:flex;justify-content:center;align-items:center;
    pointer-events:none;
}

.ring{
    position:absolute;width:min(40vw,470px);aspect-ratio:1;
    border:1px solid #ff702b35;border-radius:50%;
    box-shadow:0 0 100px #ff702b0c;
}

.ring:before,.ring:after{
    content:"";position:absolute;inset:30px;
    border:1px solid #ffffff12;border-radius:50%;
}

.ring:after{inset:75px;border-color:#ff702b30}

.center-symbol{
    width:150px;height:150px;border:1px solid #ff702b55;
    background:#ff702b0b;display:grid;place-items:center;
    transform:rotate(45deg);box-shadow:0 0 80px #ff702b20;
}

.center-symbol span{
    transform:rotate(-45deg);font-size:65px;
    color:#ff702b;font-weight:800;
}

.bottom{
    position:absolute;bottom:0;left:0;right:0;height:55px;
    border-top:1px solid #ffffff12;background:#080b11bb;
    display:flex;align-items:center;padding:0 45px;
    color:#647080;font-size:14px;letter-spacing:2px;font-weight:700;
}

.version{margin-left:auto}

@media(max-width:850px){
    .topbar{padding:0 18px}
    .nav{margin-left:25px;gap:15px}
    .nav-item{font-size:15px}
    .right-decoration{opacity:.2;right:-15%}
    .left-panel{left:7%;width:86%}
}

@media(max-width:550px){
    .nav{display:none}
    .left-panel{top:20%}
    .title{font-size:54px}
    .right-decoration{display:none}
}
</style>
</head>

<body>
<div class="background"></div>

<header class="topbar">
    <div class="brand">LAST <span>FRONTIER</span></div>

    <nav class="nav">
        <button class="nav-item active" data-page="play">SPIELEN</button>
        <button class="nav-item" data-page="equipment">AUSRÜSTUNG</button>
        <button class="nav-item" data-page="shop">SHOP</button>
        <button class="nav-item" data-page="career">KARRIERE</button>
    </nav>

    <div class="profile">
        <div class="avatar">P</div>
        <div class="player-name">PLAYER</div>
    </div>
</header>

<main class="left-panel">
    <div class="eyebrow">WILLKOMMEN ZURÜCK</div>

    <h1 class="title">LAST<br><span>FRONTIER</span></h1>

    <p class="description">
        Bereite dich auf den Kampf vor.
        Deine Mission beginnt hier.
    </p>

    <div class="section-line"></div>

    <div class="mode-title">SPIELMODUS</div>

    <div class="mode">
        <div class="mode-icon">⚔</div>
        <div class="mode-name">BATTLE ARENA</div>
    </div>

    <button class="play-button" id="playButton">SPIELEN →</button>
</main>

<div class="right-decoration">
    <div class="ring"></div>
    <div class="center-symbol"><span>✦</span></div>
</div>

<footer class="bottom">
    LAST FRONTIER
    <div class="version">VERSION 0.1</div>
</footer>

<script>
document.getElementById("playButton").addEventListener("click",()=>{
    window.location.href="match.html";
});

document.querySelectorAll(".nav-item").forEach(button=>{
    button.addEventListener("click",()=>{
        const page=button.dataset.page;

        if(page==="shop"){
            window.location.href="shop.html";
            return;
        }

        if(page==="equipment"){
            window.location.href="equipment.html";
            return;
        }

        if(page==="career"){
            window.location.href="career.html";
            return;
        }

        document.querySelectorAll(".nav-item").forEach(item=>{
            item.classList.remove("active");
        });

        button.classList.add("active");
    });
});
</script>
</body>
</html>
