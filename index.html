<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAST FRONTIER</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #080a0e;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.screen {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
        radial-gradient(ellipse at 50% 55%, #28221b 0%, transparent 45%),
        linear-gradient(135deg, #080a0e, #11141a 50%, #08090c);
}

.grid {
    position: absolute;
    inset: -50%;
    background-image:
        linear-gradient(#ffffff09 1px, transparent 1px),
        linear-gradient(90deg, #ffffff09 1px, transparent 1px);
    background-size: 65px 65px;
    transform: perspective(500px) rotateX(58deg) scale(1.5);
    mask-image: linear-gradient(transparent, black 35%, transparent 85%);
    animation: gridMove 18s linear infinite;
}

@keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 0 65px; }
}

.glow {
    position: absolute;
    width: 500px;
    height: 500px;
    background: #ff641c;
    filter: blur(180px);
    opacity: 0.12;
    border-radius: 50%;
    animation: pulse 5s infinite alternate;
}

@keyframes pulse {
    from { opacity: 0.08; transform: scale(0.8); }
    to { opacity: 0.19; transform: scale(1.2); }
}

.line {
    position: absolute;
    width: 1px;
    height: 100%;
    background: linear-gradient(transparent, #ff641c55, transparent);
}

.line.left { left: 8%; }
.line.right { right: 8%; }

.content {
    position: relative;
    z-index: 2;
    width: 100%;
    text-align: center;
    padding: 25px;
    animation: appear 1.4s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(25px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    font-size: clamp(45px, 9vw, 112px);
    font-weight: 1000;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    line-height: 0.95;
    text-shadow: 0 0 45px #ff641c35;
}

.logo span {
    color: #ff681f;
}

.underline {
    width: 90px;
    height: 4px;
    background: #ff681f;
    margin: 32px auto 55px;
    box-shadow: 0 0 20px #ff681f;
}

.start {
    position: relative;
    width: 260px;
    height: 76px;
    border: 1px solid #ff762e;
    background: linear-gradient(110deg, #ff4b12, #ff7928);
    color: white;
    font-size: 21px;
    font-weight: 900;
    letter-spacing: 0.28em;
    cursor: pointer;
    clip-path: polygon(0 0, 93% 0, 100% 25%, 100% 100%, 7% 100%, 0 75%);
    box-shadow: 0 0 35px #ff571c55;
    transition: 0.25s;
}

.start:hover {
    transform: scale(1.06);
    background: white;
    color: #ff571c;
    box-shadow: 0 0 65px #ff571caa;
}

.start:active {
    transform: scale(0.96);
}

.fade {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: #050609;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s;
}

.fade.active {
    opacity: 1;
    pointer-events: all;
}
</style>
</head>

<body>

<div class="screen">
    <div class="grid"></div>
    <div class="glow"></div>
    <div class="line left"></div>
    <div class="line right"></div>

    <main class="content">
        <h1 class="logo">
            LAST <span>FRONTIER</span>
        </h1>

        <div class="underline"></div>

        <button class="start" id="startButton">
            START
        </button>
    </main>
</div>

<div class="fade" id="fade"></div>

<script>
document.getElementById("startButton").addEventListener("click", () => {
    document.getElementById("fade").classList.add("active");

    setTimeout(() => {
        window.location.href = "game.html";
    }, 1000);
});
</script>

</body>
</html>
